name: Minify and Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # JOB 1: Handles pulling code and minifying it
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Minifiers
        run: npm install -g html-minifier-terser clean-css-cli terser

      - name: Create Build Directory & Copy Project
        run: |
          mkdir dist
          rsync -av --exclude='dist' --exclude='.git' --exclude='.github' ./ dist/

      - name: Minify HTML, CSS, and JS
        run: |
           # Minify index.html directly in the root of the build folder
          html-minifier-terser --collapse-whitespace --remove-comments --output dist/index.html dist/index.html
          
          # Minify any other HTML files safely if they exist
          find dist -type f -name "*.html" -exec html-minifier-terser --collapse-whitespace --remove-comments --output {} {} \;
          
          # Clean and minify CSS files inside the css folder
          find dist/css -type f -name "*.css" -exec cleancss -o {} {} \;
          
          # Mangle and minify JS files inside the js folder
          find dist/js -type f -name "*.js" -exec terser {} -o {} --mangle --compress \;
          

      - name: Upload Build Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  # JOB 2: Safely hands off the built files to GitHub Pages alone
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
